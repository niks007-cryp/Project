name: CI — Local AI Clipper

on:
  push:
    branches: [ main, "feature/**", "fix/**" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Python Test Suite
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Python Tests (3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify FFmpeg availability
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Run clipper doctor (CI environment check)
        run: |
          python -m clipper.cli.main doctor || true
          # 'doctor' may warn about GPU — this is expected in CI (CPU-only)

      - name: Run full pytest suite
        run: |
          pytest tests/ -v --tb=short --co -q 2>&1 | head -20
          pytest tests/ -v --tb=short
        env:
          CLIPPER_ENVIRONMENT: ci
          CLIPPER_LOG_LEVEL: WARNING

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .coverage
            coverage.xml
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Floor Regression Verification (CPU-safe, mock ASR)
  # ─────────────────────────────────────────────────────────────────────────
  floor-regression:
    name: Floor Regression (Floors 1–8)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Floor 1 — Foundation Verification
        run: python -m clipper.cli.main verify-floor 1
        env:
          CLIPPER_ENVIRONMENT: ci

      - name: Floor 2 — Media Ingestion Verification
        run: python -m clipper.cli.main verify-floor 2
        env:
          CLIPPER_ENVIRONMENT: ci

      - name: Floor 3 — Transcription Verification (mock ASR)
        run: python -m clipper.cli.main verify-floor 3
        env:
          CLIPPER_ENVIRONMENT: ci
        # Note: GPU path is SKIPPED in CI — CPU fallback is verified instead

      - name: Floor 4 — Content Intelligence Verification
        run: python -m clipper.cli.main verify-floor 4
        env:
          CLIPPER_ENVIRONMENT: ci

      - name: Floor 5 — Visual Reframing Verification
        run: python -m clipper.cli.main verify-floor 5
        env:
          CLIPPER_ENVIRONMENT: ci

      - name: Floor 6 — Video Rendering Verification
        run: python -m clipper.cli.main verify-floor 6
        env:
          CLIPPER_ENVIRONMENT: ci

      - name: Floor 7 — Web Control Panel Verification
        run: python -m clipper.cli.main verify-floor 7
        env:
          CLIPPER_ENVIRONMENT: ci

      - name: Floor 8 — Pipeline Orchestration Verification
        run: python -m clipper.cli.main verify-floor 8
        env:
          CLIPPER_ENVIRONMENT: ci

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Secret Scanning
  # ─────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Run secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: false

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4: Dependency Security Audit
  # ─────────────────────────────────────────────────────────────────────────
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run dependency audit
        run: |
          pip install -e ".[dev]"
          pip-audit --desc --format=json 2>&1 | tee audit-results.json
          # Report vulnerabilities but don't fail CI on informational advisories
          pip-audit --desc 2>&1

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: audit-results.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # Job 5: Build Validation
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build wheel

      - name: Build Python package
        run: python -m build --wheel

      - name: Verify package installs cleanly
        run: |
          pip install dist/*.whl
          python -c "import clipper; print('Package import OK:', clipper.__version__)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Job 6: Deployment Configuration Check
  # ─────────────────────────────────────────────────────────────────────────
  deployment-check:
    name: Deployment Configuration Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Verify deployment configuration files exist
        run: |
          test -f .env.example && echo ".env.example: OK" || (echo "MISSING: .env.example" && exit 1)
          test -f .gitignore   && echo ".gitignore: OK"   || (echo "MISSING: .gitignore" && exit 1)
          test -f LICENSE      && echo "LICENSE: OK"       || (echo "MISSING: LICENSE" && exit 1)
          test -f SECURITY.md  && echo "SECURITY.md: OK"   || (echo "MISSING: SECURITY.md" && exit 1)
          test -f DEPLOYMENT.md && echo "DEPLOYMENT.md: OK" || (echo "MISSING: DEPLOYMENT.md" && exit 1)

      - name: Verify .env is not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "CRITICAL: .env is tracked in Git — remove it immediately"
            exit 1
          else
            echo ".env: not tracked — OK"
          fi

      - name: Scan for hardcoded secrets patterns in source
        run: python scripts/scan_secrets.py

      - name: Verify no Windows paths in deployment-facing code
        run: python scripts/scan_windows_paths.py
